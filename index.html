<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#185a3c">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">

<link rel="icon" href="icon_192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Course d'orientation EPS</title>
<style>
:root{
  --couleur-primaire:#185a3c; --couleur-secondaire:#1f6ea5; --couleur-accent:#f57c00;
  --couleur-pose:#2b7fb8; --couleur-course:#f57c00; --couleur-verif:#2e9e4f; --couleur-classement:#7b3fa0;
  --couleur-texte:#222; --couleur-fond:#eef3ef; --couleur-blanc:#fff; --couleur-bord:#d5ddd8; --couleur-doux:#f4f7f5;
  --ok:#2e9e4f; --ko:#d32f2f;
  --ombre-douce:0 2px 8px rgba(0,0,0,.12); --ombre-forte:0 4px 14px rgba(0,0,0,.2); --rayon:16px;
}
body.mode-sombre{
  --couleur-texte:#e8ecea; --couleur-fond:#14201a; --couleur-blanc:#1f2d26; --couleur-bord:#3a4a42; --couleur-doux:#2a3a32;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--couleur-fond);color:var(--couleur-texte);padding-bottom:84px;font-size:16px}
.cache{display:none!important}
.conteneur{max-width:900px;margin:0 auto;padding:12px 14px}
.en-tete{background:var(--couleur-primaire);color:#fff;text-align:center;padding:12px 10px 10px}
.en-tete h1{margin:0;font-size:1.35em}
.en-tete p{margin:2px 0 0;font-size:.85em;opacity:.85}
.section{background:var(--couleur-blanc);border-radius:var(--rayon);padding:16px;margin-bottom:16px;box-shadow:var(--ombre-douce);border-left:5px solid var(--couleur-primaire)}
.section h2{margin:0 0 10px;font-size:1.15em;display:flex;align-items:center}
.section h2::before{content:'';width:8px;height:26px;background:var(--couleur-primaire);border-radius:4px;margin-right:10px;flex-shrink:0}
.section-pose{border-left-color:var(--couleur-pose)} .section-pose h2::before{background:var(--couleur-pose)}
.section-course{border-left-color:var(--couleur-course)} .section-course h2::before{background:var(--couleur-course)}
.section-verif{border-left-color:var(--couleur-verif)} .section-verif h2::before{background:var(--couleur-verif)}
.section-classement{border-left-color:var(--couleur-classement)} .section-classement h2::before{background:var(--couleur-classement)}
.bareme-section{background:var(--couleur-blanc);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);padding:16px;margin-bottom:16px}
.bouton{padding:12px 20px;border:none;border-radius:25px;font-size:1em;font-weight:600;cursor:pointer;transition:all .2s ease;box-shadow:var(--ombre-douce);text-transform:uppercase;letter-spacing:.5px;width:100%;min-height:48px;margin-top:8px;font-family:inherit}
.bouton:active{transform:translateY(1px)}
.bouton-primaire{background:var(--couleur-primaire);color:#fff}
.bouton-secondaire{background:var(--couleur-secondaire);color:#fff}
.bouton-danger{background:#d6204a;color:#fff}
.bouton-clair{background:var(--couleur-doux);color:var(--couleur-texte);border:2px solid var(--couleur-bord)}
.bouton-petit{width:auto;padding:8px 14px;font-size:.85em;min-height:44px;margin-top:0}
.bouton[disabled]{opacity:.45}
.ligne{display:flex;align-items:center;flex-wrap:wrap}
.ligne>*{margin-right:8px;margin-bottom:6px}
.grille{display:grid;grid-gap:8px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
label{font-weight:600;font-size:.9em;display:block;margin:6px 0 4px}
select,input[type=text],input[type=number],input[type=time],textarea{width:100%;padding:10px;border:2px solid var(--couleur-bord);border-radius:10px;font-size:1em;min-height:44px;background:var(--couleur-blanc);color:var(--couleur-texte);font-family:inherit}
textarea{min-height:90px}
.stepper-nombre{display:flex;align-items:stretch}
.stepper-nombre input{text-align:center;flex:1;min-width:0;margin:0 8px}
.stepper-btn{flex-shrink:0;width:44px;min-height:44px;border:2px solid #E0E0E0;border-radius:10px;background:#FAFAFA;font-size:1.3em;font-weight:700;cursor:pointer;color:#222}
.stepper-btn:active{background:var(--couleur-primaire);color:#fff;border-color:var(--couleur-primaire)}
body.mode-sombre .stepper-btn{background:#2a3a32;color:#e8ecea;border-color:#3a4a42}
.pastille{display:inline-block;min-width:34px;height:34px;line-height:34px;border-radius:50%;text-align:center;font-weight:700;font-size:.85em;color:#fff;padding:0 4px;flex-shrink:0}
.puce{display:inline-block;width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.35);vertical-align:middle;margin-right:6px}
.rangee{display:flex;align-items:center;padding:8px 6px;border-bottom:1px solid var(--couleur-bord);min-height:52px}
.rangee:last-child{border-bottom:none}
.rangee .nom{font-weight:700;width:48px;flex-shrink:0}
.rangee .corps{flex:1;min-width:0;padding:0 8px}
.petit{font-size:.8em;opacity:.75}
.tag{display:inline-block;padding:3px 9px;border-radius:12px;font-size:.78em;font-weight:700;background:var(--couleur-doux);border:1px solid var(--couleur-bord)}
.tag-ok{background:#d6f3df;color:#14602f;border-color:#8fd6a5}
.tag-ko{background:#fde0e0;color:#a31515;border-color:#f1a3a3}
.tag-att{background:#fff0d1;color:#7a4b00;border-color:#f0cf8c}
body.mode-sombre .tag-ok{background:#1d4a2b;color:#bdf0cc}
body.mode-sombre .tag-ko{background:#5a2323;color:#ffc9c9}
body.mode-sombre .tag-att{background:#5a4318;color:#ffe2a8}
.temps{font-family:'Courier New',monospace;font-weight:700;font-size:1.15em}
.carte-wrap{position:relative;overflow:auto;border:2px solid var(--couleur-bord);border-radius:12px;max-height:68vh;background:#fff;-webkit-overflow-scrolling:touch}
.carte-inner{position:relative;line-height:0}
.carte-inner img{width:100%;display:block;user-select:none;-webkit-user-drag:none}
.marqueur{position:absolute;cursor:pointer;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:1px solid #fff;box-shadow:0 0 0 1px #000;color:#fff;font-weight:800;font-size:8px;line-height:16px;text-align:center;touch-action:none}
.marqueur::after{content:'';position:absolute;left:-14px;top:-14px;width:44px;height:44px;border-radius:50%}
:focus-visible{outline:3px solid #ff9800;outline-offset:2px}
body.mode-sombre :focus-visible{outline-color:#ffd54f}
.info-pastille{background:#222;color:#fff;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px;line-height:1.35;min-height:44px;overflow:hidden}
.info-pastille .petit{color:#ddd}
.marqueur{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.marqueur.sel{box-shadow:0 0 0 2px #000,0 0 0 4px #fff;z-index:2}
.marqueur.deplace{box-shadow:0 0 0 2px #000,0 0 0 5px #fff;z-index:3}
.chips{display:flex;flex-wrap:wrap}
.chip{border:2px solid var(--couleur-bord);border-radius:22px;padding:7px 12px;margin:0 6px 6px 0;background:var(--couleur-doux);font-weight:600;font-size:.88em;min-height:44px;cursor:pointer;color:var(--couleur-texte);font-family:inherit}
.chip.actif{border-color:var(--couleur-primaire);background:var(--couleur-primaire);color:#fff}
.chip.fait{border-color:var(--ok)}
.saisie{width:64px!important;text-align:center;font-size:1.5em!important;font-weight:800;text-transform:uppercase;padding:4px!important;margin:0}
.res{width:34px;text-align:center;font-size:1.5em;font-weight:800;flex-shrink:0}
.res.ok{color:var(--ok)}.res.ko{color:var(--ko)}
div.defil{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tab{width:100%;border-collapse:collapse;font-size:.92em}
table.tab th,table.tab td{padding:8px 5px;border-bottom:1px solid var(--couleur-bord);text-align:center}
table.tab th{font-size:.8em;opacity:.8}
table.tab td.g{font-weight:800;text-align:left}
table.tab tr.podium-1 td{background:rgba(245,196,0,.22)}
table.tab tr.podium-2 td{background:rgba(160,160,160,.2)}
table.tab tr.podium-3 td{background:rgba(176,110,60,.18)}
.barre{position:fixed;left:0;right:0;bottom:0;background:var(--couleur-primaire);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.barre button{flex:1;min-width:0;background:none;border:none;color:#fff;opacity:.75;padding:8px 1px 6px;font-size:.72em;white-space:nowrap;min-height:56px;cursor:pointer;font-family:inherit}
.barre button span{display:block;font-size:1.5em;line-height:1.2}
.barre button.actif{opacity:1;background:rgba(0,0,0,.22);font-weight:700}
.modale-fond{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}
.modale{background:var(--couleur-blanc);border-radius:var(--rayon);padding:18px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:var(--ombre-forte)}
.modale-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.modale-header h3{margin:0}
.btn-fermer{border:none;background:none;font-size:2em;line-height:1;cursor:pointer;width:44px;height:44px;color:var(--couleur-texte)}
.bandeau{background:#fff0d1;color:#5a3a00;border:2px solid #f0cf8c;border-radius:12px;padding:10px 12px;margin:10px 14px 0}
.bandeau p{margin:0 0 4px}
body.mode-sombre .bandeau{background:#5a4318;color:#ffe2a8;border-color:#7a5b22}
.message-succes{background:#84fab0;color:#0d47a1;text-align:center;border-radius:10px;padding:10px;margin-top:8px}
.pied-page{display:flex;align-items:center;justify-content:center;margin-top:30px;padding-top:20px;border-top:1px solid rgba(128,128,128,.3)}
.pied-page-logo{width:36px;height:36px;border-radius:8px;flex-shrink:0;margin-right:10px}
.pied-page p{font-size:.85em;opacity:.7;margin:0}
.switch{position:relative;width:64px;height:44px;flex-shrink:0;display:inline-block;margin:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;top:0;left:0;right:0;bottom:0;background:#ccc;border-radius:44px;cursor:pointer;transition:background .2s}
.slider::before{content:'';position:absolute;height:36px;width:36px;left:4px;top:4px;background:#fff;border-radius:50%;transition:transform .2s}
.switch input:checked+.slider{background:var(--couleur-primaire)}
.switch input:checked+.slider::before{transform:translateX(20px)}
.codes-grid{overflow-x:auto}
.codes-grid table{border-collapse:collapse}
.codes-grid td,.codes-grid th{padding:2px;font-size:.8em}
.codes-grid input{width:44px!important;min-height:44px!important;padding:2px!important;text-align:center;text-transform:uppercase;font-weight:700}
@media (min-width:600px){.barre button{font-size:.9em}}
@media (max-width:480px){.g4{grid-template-columns:repeat(2,1fr)}.bouton{font-size:.92em}}
</style>
</head>
<body>

<div class="en-tete">
  <h1>🧭 Course d'orientation EPS</h1>
  <p>Version 2.3</p>
</div>

<div id="bandeaux"></div>
<div class="conteneur" id="vue"></div>

<div class="conteneur">
  <div class="pied-page">
    <img src="logo-outils-eps.png" alt="Logo outils-eps.fr" class="pied-page-logo">
    <p>https://outils-eps.fr par Nathalie Prenois</p>
  </div>
</div>

<div class="barre" id="barre"></div>
<div id="modale" class="cache"></div>
<div id="dialogue" class="cache"></div>
<textarea id="presse" style="position:fixed;left:-9999px;top:0;width:1px;height:1px" aria-hidden="true"></textarea>

<script>
/* ============ DONNÉES : codes des 10 couleurs x 8 balises (source : 8 Balises.pdf, NE PAS MODIFIER) ============
   Chaîne de 16 lettres par balise, ordre : A1 B1 C1 D1 A2 B2 C2 D2 A3 ... D4  (groupe = colonne + ligne) */
var BUILTIN = {"Rouge":{"1":"NUCSQTTRGVBGIGJU","2":"SQOCEESCVHHCUIJY","3":"KFJDIPCFCKOCYSZA","4":"RQOFDCJZTBUPASRU","5":"HCAPEBELPNWXSYWK","6":"IZYGYWYZNEOWNKKZ","7":"JYXUKZTSYQKYFPLA","8":"HOIVXWKUKXRNXBVE"},"Bleu":{"1":"BZWAGRDMMWCISKVZ","2":"FNRIIYTPDSJVTFOJ","3":"ZEBLVUXAVGIHFMEF","4":"MUVYKBTKSYPELXZC","5":"BHNPEZGBNMFOGVDD","6":"SSVRHOPACSMSUOGC","7":"RLXTXZXHORIMFMGD","8":"KWODWAEOQTYPBNLA"},"Vert":{"1":"VQJJGROLTLIWFAUT","2":"CZQFEPVOESGIOZYR","3":"JYVGVVWLDFKEJSHD","4":"VYYRKECBLSEAOVLA","5":"NTQYCMFKCNDERVDP","6":"TVHZOYKOVMDBIZVW","7":"YRGWGNSGGOSPLDRW","8":"DTAZTIXHPJPREHTS"},"Jaune":{"1":"ILZZULSIWSVOJMEZ","2":"KZVZBOBJQCXHYHMQ","3":"YFPVWCMQZAGYSQVK","4":"CMVOFJJUEMIUDLRV","5":"XPYEGGJUBQDIGJBP","6":"VNJBMGNKPNUKJFRB","7":"ZYVFIBZHYWJTHEAB","8":"XAJIPURQQASFLPHK"},"Orange":{"1":"QNHLEHCJWTLFDUWD","2":"NKTWJWDYQAAGJYUY","3":"NPSVZMBVVORVSMIX","4":"IESOKCLISSNUNNLI","5":"LHFRGLWZQIDOGEAD","6":"DNEPCKFVDGPSGSQE","7":"SBZXNPJXRQFAMGCU","8":"MGETTFHWBBTHRMWA"},"Violet":{"1":"NQTUKZACXZHKAALA","2":"DISIZWUHVCWEDMPT","3":"RDXGHZWYDRSPSRZF","4":"NSBBZODRXRYJPUOP","5":"REHJTMYLCGHYSBIE","6":"NWNVKDOVXEVOJYKQ","7":"FDGJMBLSFQSCIFTN","8":"YEMUXJIYJBIATFHH"},"Rose":{"1":"RFSXBIBUUKIQBHGN","2":"RYFDMUBSKQYBIVOG","3":"GUMUZEEFFMHSUPHN","4":"SZLRMKPLJWOOYJUM","5":"NYPFPEAADRVGSCIW","6":"EMBZUFJUBPDZHFUI","7":"ZMWRFQYGSIREKNAI","8":"BKRVXQTJGTIAZVKF"},"Marron":{"1":"SOIWHHSFPCIFGQFU","2":"NUIEOFNOGLKJQPGD","3":"PXWXITFHDMXCFMPG","4":"AWHMYVZMMVAXEAIH","5":"KSISOJGBCJBFLXWM","6":"DZHJMAUNWLXGNXJJ","7":"PKBGIHUPQXYYDIIH","8":"GIEIEYLTURJWMKUE"},"Cyan":{"1":"YDXCWCVYZODNVOKF","2":"MEHPHNIZPMHVDPYW","3":"NFVAZREFOBSNDZZW","4":"ROXHCJCUUAMTBEIW","5":"KINPDYWLFEQNSMXH","6":"BLQSJLVSKFGDDLWJ","7":"JRVZZIKUBVVNHEQH","8":"YNHEUIEYTTMPSYSN"},"Magenta":{"1":"FOGIERKNTLGRNJCA","2":"OTHQYDVZENDXDZDW","3":"AJQMLDVYVUJYJWPZ","4":"UDSALEHSFXNVXWGO","5":"WYBKLHPJAEAFJGPD","6":"TAPIEAAFLEIGJRYP","7":"UJVYBKQZHGTZKGZF","8":"HFQEPIXDOGLEFZKT"}};
var COULEURS = {Rouge:'#e53935',Bleu:'#1e66d0',Vert:'#2e9e4f',Jaune:'#f2c200',Orange:'#f57c00',Violet:'#7b3fa0',Rose:'#f48fb1',Marron:'#8d5a3b',Cyan:'#00bcd4',Magenta:'#d81b9a'};
var TEXTE_SOMBRE = {Jaune:1,Rose:1,Cyan:1,Orange:1,Vert:1};
var PENALITES = [['sep','Élève séparé de son groupe'],['ind','Indications données aux autres groupes'],['dep','Balise déplacée'],['rdv','Heure de RDV dépassée']];
var MDP_DEFAUT = 'ADMINPROF';
var CLE = 'co_eps_v1';

/* ============ ÉTAT ============ */
var S;
var GROUPES_DEFAUT=['A1','A2','A3','A4','B1','B2','B3','B4','C1','C2','C3','C4','D1','D2','D3','D4'];
function etatInitial(){
  return {
    v:1, groupes:GROUPES_DEFAUT.slice(),
    sets:[], penSec:60, modeEleve:null, indices:true, ptsBalise:1, ptsIndice:0.5, mdp:null, sombre:false, afficherAttendu:true, initiales:false, derniereSauv:0, rappelJusqua:0,
    seance:{setIds:['Orange','Bleu'], assign:{}, parcours:1, pos:{}, etat:{}, poste:{}, desc:{}},
    classes:[], cur:null, onglet:'pose', rosters:{}
  };
}
var APP_VER='2.17';
/* Protection des classes : jamais d'écrasement des données si la lecture échoue, copie de secours
   (_auto = dernier état contenant des classes, _avant_maj = état avant changement de version) et
   restauration automatique si l'état principal est trouvé vide alors qu'une copie contient des classes. */
function lireJSON(cle){ try{ var t=localStorage.getItem(cle); return t?JSON.parse(t):null; }catch(e){ return null; } }
function nbCl(o){ return (o&&o.classes&&o.classes.length)||0; }
/* Validation structurelle d'un état (démarrage, copies de secours, restauration d'une sauvegarde) :
   un état mal formé n'est jamais appliqué (sinon l'appli ne redémarre plus). Complète aussi les champs manquants
   des états d'anciennes versions. Les identifiants et couleurs sont restreints à des caractères sûrs (insérés dans le HTML). */
var RE_ID=/^[A-Za-z0-9_|-]{1,40}$/, RE_COUL=/^#[0-9a-fA-F]{6}$/, RE_ONGLET=/^(groupes|pose|carte|course|verif|classement|reglages)$/;
function estObj(x){ return x!==null && typeof x==='object' && !Array.isArray(x); }
function estNb(x){ return typeof x==='number' && isFinite(x); }
function toutesChaines(a){ for(var i=0;i<a.length;i++) if(typeof a[i]!=='string') return false; return true; }
function valeursNb(o){ for(var k in o) if(!estNb(o[k])) return false; return true; }
function etatValide(o){
  try{
    if(!estObj(o)) return false;
    if('groupes' in o && (!Array.isArray(o.groupes)||!o.groupes.length||o.groupes.length>40||!toutesChaines(o.groupes))) return false;
    if(!estNb(o.penSec)||o.penSec<0) o.penSec=60;
    if(o.mdp!==null && typeof o.mdp!=='string') o.mdp=null;
    if(typeof o.onglet!=='string'||!RE_ONGLET.test(o.onglet)) o.onglet='pose';
    if(o.cur!==null && typeof o.cur!=='string') o.cur=null;
    if(typeof o.initiales!=='boolean') o.initiales=false;
    if(typeof o.indices!=='boolean') o.indices=true;
    if(typeof o.modeEleve!=='string') o.modeEleve=null;
    if(!estNb(o.ptsBalise)||o.ptsBalise<0.5||o.ptsBalise>100) o.ptsBalise=1;
    if(!estNb(o.ptsIndice)||o.ptsIndice<0||o.ptsIndice>o.ptsBalise) o.ptsIndice=Math.min(0.5,o.ptsBalise);
    if(!estNb(o.derniereSauv)) o.derniereSauv=0;
    if(!estNb(o.rappelJusqua)) o.rappelJusqua=0;
    var i,j,k,g;
    if('sets' in o){ if(!Array.isArray(o.sets)) return false;
      for(i=0;i<o.sets.length;i++){ var st=o.sets[i];
        if(!estObj(st)||!RE_ID.test(st.id)||typeof st.nom!=='string'||!RE_COUL.test(st.couleur)||!estNb(st.n)||st.n<1||st.n>30) return false;
        if(!estObj(st.codes)) st.codes={}; } }
    if('seance' in o){ var se=o.seance; if(!estObj(se)) return false;
      if('setIds' in se){ if(!Array.isArray(se.setIds)||!toutesChaines(se.setIds)) return false; } else se.setIds=['Orange','Bleu'];
      ['assign','pos','etat','poste','desc'].forEach(function(f){ if(!estObj(se[f])) se[f]={}; });
      if(!estNb(se.parcours)||se.parcours<1||se.parcours>5) se.parcours=1;
      for(k in se.assign) if(typeof se.assign[k]!=='string') return false;
      for(k in se.pos){ if(!estObj(se.pos[k])) return false; for(g in se.pos[k]){ var pp=se.pos[k][g]; if(!estObj(pp)||!estNb(pp.x)||!estNb(pp.y)) return false; } }
      for(k in se.poste) if(!estObj(se.poste[k])) return false;
      for(k in se.desc){ if(!estObj(se.desc[k])){ delete se.desc[k]; continue; } for(g in se.desc[k]) if(typeof se.desc[k][g]!=='string') delete se.desc[k][g]; } }
    if('classes' in o){ if(!Array.isArray(o.classes)) return false;
      for(i=0;i<o.classes.length;i++){ var c=o.classes[i];
        if(!estObj(c)||!RE_ID.test(c.id)||typeof c.nom!=='string') return false;
        if(typeof c.rdv!=='string') c.rdv='';
        if(c.mode!=='groupe') c.mode='tous';
        if(!estObj(c.depart)) c.depart={all:null,g:{}};
        if(!estObj(c.depart.g)) c.depart.g={};
        if(c.depart.all===undefined) c.depart.all=null;
        if(c.depart.all!==null&&!estNb(c.depart.all)) return false;

/* Import tolérant : séparateur ; , ou tabulation (détecté ligne par ligne), colonnes dans n'importe quel ordre.

function fmtHms(sec){ sec=Math.max(0,Math.round(sec)); return Math.floor(sec/3600)+':'+pad(Math.floor(sec%3600/60))+':'+pad(sec%60); }
/* Cellule CSV : préfixe ' si le texte commence par = + - @ (Excel l'exécuterait comme une formule) */
function celCsv(x,sep){
  x=String(x==null?'':x); if(/^[=+\-@]/.test(x)) x="'"+x;
  if(sep===';') return /[;"\r\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;
  return x.replace(/[\t\r\n]+/g,' ');
}
function construireCsv(c,sep){
  var rows=classement(c), bals=balisesAssignees();
  var ent=['Rang','Groupe','Élèves','Balise posée','N° poste','Points','Points max','Balises validées','Balises à chercher','Indices utilisés','Départ','Arrivée','Temps course (h:mm:ss)','Pénalités (nb)','Pénalités (min)','Temps final (h:mm:ss)'];
  if(uiCsvDetail) bals.forEach(function(b){ ent.push(baliseLabel(b)); });
  var lignes=[ent];
  rows.forEach(function(r){
    var d=debut(c,r.g), a=c.arrivee[r.g];
    var l=[r.rang,r.g,nomsGroupe(c,r.g,true).replace(/ · /g,' / '),S.seance.assign[r.g]?baliseLabel(S.seance.assign[r.g]):'',S.seance.assign[r.g]?posteB(S.seance.assign[r.g]):'',fmtPts(r.pts),fmtPts(r.max),r.n,r.tot,r.ind,d?heure(d):'',a?heure(a):'',r.tc!=null?fmtHms(r.tc):'',r.pen,r.pen*S.penSec/60,r.tf!=null?fmtHms(r.tf):''];
    if(uiCsvDetail) bals.forEach(function(b){
      if(S.seance.assign[r.g]===b){ l.push('(posée)'); return; }
      if(invalide(b)){ l.push('invalide'); return; }
      var v=(c.codes[r.g]||{})[b]||''; l.push(v===''?'non trouvée':(v===codeAttendu(b,r.g)?(indiceUtilise(c,r.g,b)?'OK (indice)':'OK'):'faux ('+v+')'));
    });
    lignes.push(l);
  });
  return lignes.map(function(l){ return l.map(function(x){ return celCsv(x,sep); }).join(sep); }).join('\r\n');
}
/* Remise d'un fichier à l'utilisateur. iPhone/iPad : un lien « download » sur un blob est ignoré ou ouvert en aperçu dans une
   appli installée ; on passe par la feuille de partage (« Enregistrer dans Fichiers »). Ailleurs : téléchargement classique. */
var EST_IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function telechargerBlob(nom,blob){
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nom;
  document.body.appendChild(a); a.click(); setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(a.href);},500);
}
function livrerFichier(nom,contenu,type,onOk){
  var blob=new Blob([contenu],{type:type});
  if(EST_IOS&&navigator.share&&navigator.canShare&&window.File){
    try{
      var f=new File([blob],nom,{type:type});
      if(navigator.canShare({files:[f]})){
        navigator.share({files:[f],title:nom}).then(function(){ if(onOk) onOk(); },function(err){
          if(err&&err.name==='AbortError') return;
          telechargerBlob(nom,blob); if(onOk) onOk();
        });
        return;
      }
    }catch(e){}
  }
  telechargerBlob(nom,blob); if(onOk) onOk();
  toast(EST_IOS?'Fichier ouvert : touche Partager puis « Enregistrer dans Fichiers »':'Fichier enregistré dans Téléchargements',3500);
}
function telechargerCsv(){
  var c=classe(); if(!c) return;
  livrerFichier('CO_EPS_'+c.nom.replace(/[^A-Za-z0-9À-ÿ_-]/g,'')+'_'+aujourdhui()+'.csv','\ufeff'+construireCsv(c,';'),'text/csv;charset=utf-8');
}

  var c=classe(); if(!c) return; var t=$('presse'); t.value=construireCsv(c,'\t'); t.select();
  var ok=false; try{ok=document.execCommand('copy');}catch(e){}

}

    case 'indice': if(c&&g&&b){ confirmer('Révéler l\'indice de '+baliseLabel(b)+' au groupe '+g+' ? Si la balise est trouvée, elle ne vaudra que '+fmtPts(S.ptsIndice)+' pt au lieu de '+fmtPts(S.ptsBalise)+'.',function(){ if(!c.indices[g]) c.indices[g]={}; c.indices[g][b]=true; sauver(); dessiner(); },'Révéler l\'indice',true); } break;
    case 'ptsb': S.ptsBalise=Math.max(0.5,Math.min(100,S.ptsBalise+parseFloat(el.getAttribute('data-d')))); if(S.ptsIndice>S.ptsBalise) S.ptsIndice=S.ptsBalise; sauver(); dessiner(); break;
    case 'ptsi': S.ptsIndice=Math.max(0,Math.min(S.ptsBalise,S.ptsIndice+parseFloat(el.getAttribute('data-d')))); sauver(); dessiner(); break;
    case 'vg': uiVerifG=g; dessiner(); focusVerif(); break;
    case 'csv': telechargerCsv(); break;
    case 'copier': copierCsv(); break;
    case 'majgroupes': var l=$('inGroupes').value.split(/[,;\s]+/).map(function(x){return x.trim().toUpperCase();}).filter(function(x,i,ar){return x&&ar.indexOf(x)===i;}); if(l.length){
      var msgs=[], anciens=S.groupes.filter(function(x){return l.indexOf(x)<0;});
      if(!l.every(function(x){return /^[A-D][1-4]$/.test(x);})) msgs.push('Les codes des balises d\'origine (PDF) n\'existent que pour les groupes A1 à D4 : avec les autres noms, aucune saisie ne sera validée sur ces balises (seuls les jeux personnalisés fonctionneront).');
      if(anciens.length&&groupesAvecDonnees(anciens)) msgs.push('Des chronos, pénalités, codes ou compositions sont déjà enregistrés pour : '+anciens.join(', ')+'. Ils ne seront plus rattachés à aucun groupe.');
      var enreg=function(){ S.groupes=l; for(var k in S.seance.assign) if(l.indexOf(k)<0) delete S.seance.assign[k]; sauver(); toast('Groupes enregistrés'); };
      if(msgs.length) confirmer(msgs.join('\n\n')+'\n\nEnregistrer quand même ?',enreg,'Enregistrer'); else enreg(); } break;
    case 'pensec': S.penSec=Math.max(0,S.penSec+parseInt(el.getAttribute('data-d'),10)); sauver(); dessiner(); break;
    case 'newset': modaleSet(''); break;
    case 'editset': modaleSet(el.getAttribute('data-id')); break;
    case 'delset': var sid=el.getAttribute('data-id'); confirmer('Supprimer ce jeu de balises ?',function(){ S.sets=S.sets.filter(function(s){return s.id!==sid;}); S.seance.setIds=S.seance.setIds.map(function(x){return x===sid?'':x;}); sauver(); dessiner(); },'Supprimer',true); break;
    case 'setn': var inN=$('sN'), cur=lireGrille(), nn=Math.max(1,Math.min(30,parseInt(inN.value,10)+parseInt(el.getAttribute('data-d'),10))); inN.value=nn; $('sGrille').innerHTML=grilleCodes({codes:cur},nn); break;
    case 'importcodes': var lignes=$('sColler').value.split(/\r?\n/).filter(function(x){return x.trim();}); var cur2={}; lignes.forEach(function(ln,i){ var cs=ln.split(/\t|;|,/); cur2[i+1]={}; S.groupes.forEach(function(gg,j){ cur2[i+1][gg]=(cs[j]||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,1); }); }); var n2=Math.max(1,Math.min(30,lignes.length)); $('sN').value=n2; $('sGrille').innerHTML=grilleCodes({codes:cur2},n2); break;
    case 'saveset': var idd=el.getAttribute('data-id'), nm=$('sNom').value.trim(); if(!nm){ avertir('Donne un nom au jeu.'); break; }
      var obj={id:idd||('s'+Date.now()),nom:nm,couleur:$('sCoul').value,n:parseInt($('sN').value,10),codes:lireGrille()};
      if(idd){ S.sets=S.sets.map(function(s){return s.id===idd?obj:s;}); } else S.sets.push(obj);
      sauver(); fermerModale(); dessiner(); break;
    case 'chgmdp': saisir('Nouveau mot de passe (vide = revenir au mot de passe par défaut) :','',function(nv){ if(nv!==null){ S.mdp=nv.trim()||null; sauver(); toast('Mot de passe mis à jour'); } },'Enregistrer',true); break;
    case 'aide': ouvrirModale('<div class="modale-header"><h3>Aide</h3><button class="btn-fermer" data-act="fermer">&times;</button></div><p><b>1. Pose</b> : choisis 2 couleurs, attribue les balises aux groupes, place chaque balise sur la carte, contrôle-les.</p><p><b>2. Course</b> : crée la classe, donne le départ (tous ou groupe par groupe), touche « Arrivée » à chaque retour, ajoute les pénalités.</p><p><b>3. Vérif.</b> : saisis les lettres relevées sur la feuille de chaque groupe.</p><p><b>4. Classement</b> : balises validées, puis temps. Export CSV.</p><p>Tout est enregistré automatiquement sur la tablette.</p>'); break;
    case 'nouvelle': var lanceNouvelle=function(){ confirmer('Terminer la séance ? Balises, positions et résultats seront effacés ; les groupes actuels sont archivés. Dernière sauvegarde : '+texteAge()+'.',function(){ for(var rn in S.rosters){ var ro=S.rosters[rn]; if(Object.keys(ro.compo).some(function(k){return ro.compo[k].length;})){ ro.histo.push(JSON.parse(JSON.stringify(ro.compo))); } ro.compo={}; ro.absent={}; } var d=etatInitial(); d.rosters=S.rosters; d.classes=S.classes.map(function(k){ k.depart={all:null,g:{}}; k.arrivee={}; k.pen={}; k.codes={}; k.absents={}; k.indices={}; return k; }); d.cur=S.cur; d.sets=S.sets; d.groupes=S.groupes; d.penSec=S.penSec; d.mdp=S.mdp; d.sombre=S.sombre; d.afficherAttendu=S.afficherAttendu; d.initiales=S.initiales; d.indices=S.indices; d.ptsBalise=S.ptsBalise; d.ptsIndice=S.ptsIndice; d.derniereSauv=S.derniereSauv; d.rappelJusqua=S.rappelJusqua; d.onglet='pose'; S=d; attribuerAuto(); uiVerifG=null; uiSel=null; sauver(); dessiner(); toast('Nouvelle séance prête : balises attribuées'); },'Terminer la séance',true); }; if(deverrouille) lanceNouvelle(); else demanderMdp(lanceNouvelle); break;
    case 'okmdp': var v=$('inMdp').value.trim(); if(mdpOk(v)){ fermerModale(); var f=cbMdp; cbMdp=null; if(f) f(); } else { echecs++; afficherMdp('Mot de passe incorrect.'); } break;
    case 'resetmdp':
      if(!finReset){ finReset=Date.now()+ATTENTE_RESET*1000; afficherMdp(''); clearInterval(timerReset); timerReset=setInterval(majCompteReset,1000); }
      else if(Date.now()>=finReset){ confirmer('Remettre le mot de passe prof par défaut ? Le mot de passe actuel sera perdu.',function(){ S.mdp=null; echecs=0; finReset=0; sauver(); afficherMdp('Mot de passe réinitialisé : utilise celui par défaut.'); },'Réinitialiser',true); }
      break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target, k=t.getAttribute&&t.getAttribute('data-chg'); if(!k) return; if(S.modeEleve) return; var c=classe();
  switch(k){
    case 'setid': S.seance.setIds[parseInt(t.getAttribute('data-i'),10)]=t.value; sauver(); dessiner(); break;
    case 'assign': var g=t.getAttribute('data-g'); if(t.value){ for(var x in S.seance.assign) if(S.seance.assign[x]===t.value) delete S.seance.assign[x]; S.seance.assign[g]=t.value; } else delete S.seance.assign[g]; sauver(); dessiner(); break;
    case 'fichiereleves': if(c&&t.files&&t.files[0]){ var fr=new FileReader(); fr.onload=function(){ var rs2=importerEleves(roster(c),decoderTexte(fr.result)); sauver(); dessiner(); toast(rs2.ajoutes+' ajouté(s)'+(rs2.majs?' · '+rs2.majs+' genre(s) corrigé(s)':'')+(rs2.doublons?' · '+rs2.doublons+' doublon(s)':'')); }; fr.readAsArrayBuffer(t.files[0]); } break;
    case 'fichiersauv': if(t.files&&t.files[0]){ var fs=new FileReader(); fs.onload=function(){ try{ var ob=JSON.parse(fs.result); if(!ob||!ob.classes||!ob.rosters||!etatValide(ob)) throw 1; confirmer('Restaurer cette sauvegarde ('+ob.classes.length+' classe(s), '+nbElevesTotal(ob)+' élève(s)) ? Les données actuelles seront remplacées.',function(){ try{ appliquerEtat(ob); toast('Sauvegarde restaurée'); }catch(er2){ avertir('Restauration impossible : rien n\'a été modifié.'); } },'Restaurer'); }catch(er){ avertir('Fichier de sauvegarde invalide ou endommagé : rien n\'a été modifié.'); } }; fs.readAsText(t.files[0]); try{ t.value=''; }catch(e){} } break;
    case 'eleveprs': if(c){ var rp=roster(c); if(t.checked) delete rp.absent[t.getAttribute('data-id')]; else rp.absent[t.getAttribute('data-id')]=1; sauver(); dessinerGarde(); } break;
    case 'moveel': if(c){ var rm=roster(c), idm=t.getAttribute('data-id'); for(var gm in rm.compo) rm.compo[gm]=rm.compo[gm].filter(function(x){return x!==idm;}); if(t.value){ if(!rm.compo[t.value]) rm.compo[t.value]=[]; rm.compo[t.value].push(idm); } sauver(); dessinerGarde(); } break;
    case 'poste': if(uiSel){ if(!S.seance.poste) S.seance.poste={}; var spp=S.seance.parcours; if(!S.seance.poste[spp]) S.seance.poste[spp]={}; if(t.value) S.seance.poste[spp][uiSel]=t.value; else delete S.seance.poste[spp][uiSel]; sauver(); dessiner(); } break;
    case 'classe': S.cur=t.value; sauver(); dessiner(); break;
    case 'mode': if(c){ c.mode=t.value; sauver(); dessiner(); } break;
    case 'rdv': if(c){ c.rdv=t.value; sauver(); } break;
    case 'absent': if(c){ var gg=t.getAttribute('data-g'); if(t.checked) c.absents[gg]=1; else delete c.absents[gg]; sauver(); dessiner(); } break;
    case 'csvdetail': uiCsvDetail=t.checked; break;
    case 'sombre': S.sombre=t.checked; sauver(); dessiner(); break;
    case 'attendu': S.afficherAttendu=t.checked; sauver(); break;
    case 'desc': if(uiSel){ if(!S.seance.desc) S.seance.desc={}; var spd=S.seance.parcours; if(!S.seance.desc[spd]) S.seance.desc[spd]={}; var vd=String(t.value).replace(/\s+/g,' ').trim().slice(0,140); if(vd) S.seance.desc[spd][uiSel]=vd; else delete S.seance.desc[spd][uiSel]; sauver(); var cwd=$('carteWrap'), sxd=cwd?cwd.scrollLeft:0, syd=cwd?cwd.scrollTop:0; dessiner(); cwd=$('carteWrap'); if(cwd){ cwd.scrollLeft=sxd; cwd.scrollTop=syd; } } break;
    case 'indices': S.indices=t.checked; sauver(); dessiner(); break;
    case 'initiales': S.initiales=t.checked; sauver(); dessiner(); break;
  }
});
document.addEventListener('input',function(e){ var t=e.target; if(t.getAttribute&&t.getAttribute('data-in')) saisieCode(t); });
document.addEventListener('focusin',function(e){ var t=e.target; if(t.getAttribute&&t.getAttribute('data-in')&&t.select) t.select(); });

/* ============ CHRONO LIVE, SAUVEGARDE, VEILLE ============ */
setInterval(function(){ try{ verifAlertesRdv(); }catch(e){} if(S.onglet!=='course') return; majRdvLive(classe()); var els=document.querySelectorAll('[data-live]'); for(var i=0;i<els.length;i++) els[i].textContent=fmt((Date.now()-parseInt(els[i].getAttribute('data-live'),10))/1000); },1000);
setInterval(sauver,15000);
window.addEventListener('beforeunload',sauver);
/* Wake Lock : un seul verrou à la fois. Le navigateur le relâche seul quand la page est masquée (événement « release ») ;
   on le redemande alors au retour, sans empiler de verrous. */
var wl=null, wlEnCours=false;
function veille(){
  try{
    if(!navigator.wakeLock || wl || wlEnCours || document.visibilityState!=='visible') return;
    wlEnCours=true;
    navigator.wakeLock.request('screen').then(function(l){
      wlEnCours=false; wl=l;
      if(l.addEventListener) l.addEventListener('release',function(){ if(wl===l) wl=null; });
    },function(){ wlEnCours=false; });
  }catch(e){ wlEnCours=false; }
}
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden') sauver(); else veille(); });
veille();
document.addEventListener('click',function(){ veille(); },{once:true});
function plein(){ try{ var d=document.documentElement; if(d.requestFullscreen && !document.fullscreenElement) d.requestFullscreen().catch(function(){}); }catch(e){} }
document.addEventListener('click',plein,{once:true});
/* ============ BANDEAUX (mise à jour, hors ligne incomplet, rappel de sauvegarde) ============ */
function bandeau(id,html){ var b=$('b_'+id); if(!b){ b=document.createElement('div'); b.id='b_'+id; b.className='bandeau'; $('bandeaux').appendChild(b); } b.innerHTML=html; }
function texteAge(){ if(!S.derniereSauv) return 'jamais'; var j=Math.floor((Date.now()-S.derniereSauv)/86400000); return j<1?'aujourd\'hui':'il y a '+j+' jour(s)'; }
/* Rappel de sauvegarde : élèves enregistrés et pas d'export depuis plus de 30 jours ; « Plus tard » repousse de 7 jours */
function majRappelSauvegarde(){
  if(S.modeEleve){ retirerBandeau('sauv'); return; }
  var age=S.derniereSauv?(Date.now()-S.derniereSauv)/86400000:Infinity;
  if(nbElevesTotal(S)>0 && age>30 && Date.now()>S.rappelJusqua && S.onglet!=='reglages')
    bandeau('sauv','<p>💾 <b>Pense à sauvegarder tes données</b> (dernière sauvegarde : '+texteAge()+').</p><div class="ligne"><button class="bouton bouton-primaire bouton-petit" data-act="exportsauv">Exporter maintenant</button><button class="bouton bouton-clair bouton-petit" data-act="plustard">Plus tard</button></div>');
  else retirerBandeau('sauv');
}
function retirerBandeau(id){ var b=$('b_'+id); if(b&&b.parentNode) b.parentNode.removeChild(b); }
var FICHIERS_HL=['index.html','manifest.json','icon_192.png','icon_512.png','logo-outils-eps.png','cartes/parcours1.jpg','cartes/parcours2.jpg','cartes/parcours3.jpg','cartes/parcours4.jpg','cartes/parcours5.jpg'];
/* Vérifie que tout est bien en cache pour le hors ligne ; re-télécharge ce qui manque, sinon prévient */
function verifierHorsLigne(){
  if(!window.caches||!navigator.serviceWorker||!navigator.serviceWorker.controller) return;
  function manquants(){ return Promise.all(FICHIERS_HL.map(function(f){ return caches.match(f).then(function(r){ return r?null:f; }); })).then(function(l){ return l.filter(Boolean); }); }
  manquants().then(function(m){
    if(!m.length) return;
    return Promise.all(m.map(function(f){ return fetch(f).catch(function(){}); })).then(manquants).then(function(m2){
      if(m2.length) bandeau('hl','<p>⚠️ <b>Mode hors ligne incomplet</b> : '+m2.length+' fichier(s) pas encore enregistré(s) ('+esc(m2.join(', '))+').</p><p class="petit">Ouvre l\'appli une fois avec le wifi, puis rouvre-la.</p>');
    });
  }).catch(function(){});
}
if('serviceWorker' in navigator && location.protocol!=='file:'){
  var avaitCtrl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(function(){});
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(avaitCtrl) bandeau('maj','<p>🆕 <b>Nouvelle version prête.</b></p><button class="bouton bouton-primaire bouton-petit" data-act="recharger">Recharger maintenant</button>');
  });
  setTimeout(verifierHorsLigne,4000);
}

if(S.classes.length&&!classe()) S.cur=S.classes[0].id;
if(!Object.keys(S.seance.assign).length) attribuerAuto();
dessiner();
</script>
